<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1086" width="880" height="1086" role="img" aria-labelledby="t d">
  <title id="t">How the RISE Humanities Data Benchmark works</title>
  <desc id="d">Benchmarks define sources, prompts, schema, ground truth and scorer; tests in benchmarks_tests.csv configure provider, model and prompt; the runner asks the model, scores each answer and stores it under results; stored results feed the website, the dataset release and date reports. A new major benchmark version re-scores the stored answers without new requests.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .t { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
    .step { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; fill: #0969da; }
    .h { font-size: 22px; font-weight: 700; }
    .path { font-size: 13.5px; fill: #59636e; }
    .name { font-size: 14px; font-weight: 600; }
    .desc { font-size: 14.5px; fill: #59636e; }
    .small { font-size: 13px; }
    .muted { fill: #59636e; }
    .link { fill: #0969da; }
    .flow { stroke: #59636e; stroke-width: 2; fill: none; }
    .head { fill: #59636e; }
    .loop { stroke: #bc4c00; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .loophead { fill: #bc4c00; }
    .looptext { fill: #bc4c00; font-size: 14px; }
    .lm { fill: #bc4c00; font-size: 13.5px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #151b23; stroke: #3d444d; }
      .card { fill: #0d1117; stroke: #3d444d; }
      .t, .m { fill: #f0f6fc; }
      .path, .desc, .muted { fill: #9198a1; }
      .step, .link { fill: #4493f8; }
      .flow { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .loop { stroke: #f0883e; }
      .loophead { fill: #f0883e; }
      .looptext { fill: #f0883e; }
      .lm { fill: #f0883e; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="loophead" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="880" height="1086" rx="12"/>

  <!-- 1 Benchmarks -->
  <rect class="box" x="24" y="40" width="388" height="344" rx="10"/>
  <text class="t step" x="42" y="70">1 · DEFINE</text>
  <text class="t h" x="42" y="96">Benchmarks</text>
  <text class="m path" x="42" y="118">benchmarks/&lt;name&gt;/</text>
  <text class="m name" x="42" y="154">images/ · texts/</text><text class="t desc" x="226" y="154">the scans or texts</text>
  <text class="m name" x="42" y="188">prompts/</text><text class="t desc" x="226" y="188">what the model is asked</text>
  <text class="m name" x="42" y="222">dataclass.py</text><text class="t desc" x="226" y="222">the answer schema</text>
  <text class="m name" x="42" y="256">ground_truths/</text><text class="t desc" x="226" y="256">the expected answers</text>
  <text class="m name" x="42" y="290">benchmark.py</text><text class="t desc" x="226" y="290">the scorer</text>
  <text class="m name" x="42" y="324">meta.json · README.md</text><text class="t desc" x="226" y="324">card, versions, ranking</text>
  <text class="t small muted" x="42" y="366">New benchmark: <tspan class="m">scripts/create_benchmark.py</tspan></text>

  <!-- 2 Tests -->
  <rect class="box" x="468" y="40" width="388" height="344" rx="10"/>
  <text class="t step" x="486" y="70">2 · CONFIGURE</text>
  <text class="t h" x="486" y="96">Tests</text>
  <text class="m path" x="486" y="118">benchmarks/benchmarks_tests.csv</text>
  <text class="t desc" x="486" y="148">One row per configuration: benchmark,</text>
  <text class="t desc" x="486" y="168">provider, model, prompt, temperature, rules</text>
  <rect class="card" x="482" y="184" width="360" height="48" rx="6"/>
  <text class="m small" x="496" y="204"><tspan font-weight="700">T0100</tspan>  business_letters</text>
  <text class="m small muted" x="496" y="223">anthropic · claude-opus-4-20250514</text>
  <rect class="card" x="482" y="238" width="360" height="48" rx="6"/>
  <text class="m small" x="496" y="258"><tspan font-weight="700">T1956</tspan>  bibliographic_data</text>
  <text class="m small muted" x="496" y="277">mistral · ministral-3b-2512</text>
  <rect class="card" x="482" y="292" width="360" height="48" rx="6"/>
  <text class="m small" x="496" y="312"><tspan font-weight="700">T2219</tspan>  magazine_pages</text>
  <text class="m small muted" x="496" y="331">openrouter · nex-agi/nex-n2.5-pro</text>
  <text class="t desc" x="486" y="366">IDs are sequential; old rows are not edited.</text>

  <!-- flow: tests -> runner, benchmarks -> tests -->
  <path class="flow" d="M414,212 H465" marker-end="url(#a)"/>
  <path class="flow" d="M662,386 V467" marker-end="url(#a)"/>

  <!-- re-scoring loop: benchmarks -> results -->
  <path class="loop" d="M218,386 V466" marker-end="url(#al)"/>
  <text class="t looptext" x="234" y="420">New MAJOR version (ground truth, scorer):</text>
  <text class="t looptext" x="234" y="442"><tspan class="m lm">rescore.py · rewrite_scores.py</tspan> re-score stored answers</text>

  <!-- 3 Runner -->
  <rect class="box" x="468" y="470" width="388" height="346" rx="10"/>
  <text class="t step" x="486" y="500">3 · RUN</text>
  <text class="t h" x="486" y="526">Runner</text>
  <text class="m path" x="486" y="548">scripts/</text>
  <text class="m name" x="486" y="584">run_benchmarks.py</text><text class="t desc" x="660" y="584">runs a list of tests</text>
  <text class="m name" x="486" y="616">run_single_test.py</text><text class="t desc" x="660" y="616">one test, or ad hoc</text>
  <text class="m name" x="486" y="648">ai_client</text><text class="t desc" x="660" y="648">one API for all providers</text>
  <text class="m name" x="486" y="680">benchmark.py</text><text class="t desc" x="660" y="680">scores each answer</text>
  <text class="m name" x="486" y="712">data/pricing.json</text><text class="t desc" x="660" y="712">cost of each request</text>
  <text class="m name" x="486" y="744">supervise_run.py</text><text class="t desc" x="660" y="744">restarts a stalled run</text>
  <text class="m name" x="486" y="776">watch_run.py</text><text class="t desc" x="660" y="776">reports spend and waste</text>

  <!-- flow: runner -> results -->
  <path class="flow" d="M466,643 H415" marker-end="url(#a)"/>

  <!-- 4 Results -->
  <rect class="box" x="24" y="470" width="388" height="346" rx="10"/>
  <text class="t step" x="42" y="500">4 · STORE</text>
  <text class="t h" x="42" y="526">Results</text>
  <text class="m path" x="42" y="548">results/&lt;date&gt;/&lt;test id&gt;/</text>
  <text class="m name" x="42" y="584">request_&lt;object&gt;.json</text>
  <text class="t desc" x="42" y="604">one per object: the answer, tokens, cost,</text>
  <text class="t desc" x="42" y="624">benchmark version</text>
  <text class="m name" x="42" y="660">scoring.json</text>
  <text class="t desc" x="42" y="680">the run's scores and benchmark version</text>
  <rect class="card" x="38" y="704" width="360" height="86" rx="6"/>
  <text class="m small muted" x="52" y="728">2026-10-29/T1956/</text>
  <text class="m small muted" x="68" y="750">request_T1956_page_2.json</text>
  <text class="m small muted" x="68" y="772">… scoring.json</text>

  <!-- publish bus -->
  <path class="flow" d="M218,818 V846"/>
  <path class="flow" d="M158,846 H726"/>
  <path class="flow" d="M158,846 V872" marker-end="url(#a)"/>
  <path class="flow" d="M440,846 V872" marker-end="url(#a)"/>
  <path class="flow" d="M726,846 V872" marker-end="url(#a)"/>
  <text class="t step" x="744" y="851">5 · PUBLISH</text>

  <!-- 5 outputs -->
  <rect class="box" x="24" y="876" width="268" height="186" rx="10"/>
  <text class="t h" x="40" y="908">Website</text>
  <text class="m path" x="40" y="932">scripts/compare →</text>
  <text class="m path" x="40" y="950">collected_results/</text>
  <text class="t desc" x="40" y="978">benchmark-frontend builds</text>
  <text class="t desc" x="40" y="998">the site: rankings,</text>
  <text class="t desc" x="40" y="1018">comparisons, cards</text>

  <rect class="box" x="306" y="876" width="268" height="186" rx="10"/>
  <text class="t h" x="322" y="908">Dataset</text>
  <text class="m path" x="322" y="932">scripts/export_dataset</text>
  <text class="m path" x="322" y="950">scripts/package_dataset.py</text>
  <text class="t desc" x="322" y="978">every run, request and score</text>
  <text class="t desc" x="322" y="998">as Parquet and CSV; one</text>
  <text class="t desc" x="322" y="1018">release per software version</text>
  <text class="m small link" x="322" y="1046">doi.org/10.5281/zenodo.23821532</text>

  <rect class="box" x="588" y="876" width="268" height="186" rx="10"/>
  <text class="t h" x="604" y="908">Reports</text>
  <text class="m path" x="604" y="932">scripts/</text>
  <text class="m path" x="604" y="950">generate_date_report.py</text>
  <text class="t desc" x="604" y="978">one day's results as</text>
  <text class="t desc" x="604" y="998">an HTML page</text>
  <text class="m small link" x="604" y="1046">reports/&lt;date&gt;_report.html</text>
</svg>
